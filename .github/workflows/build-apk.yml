name: Build and Sign APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Build web app
        run: pnpm build
      
      - name: Copy index.html to dist root
        run: cp dist/public/index.html dist/index.html
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'
          accept-android-sdk-licenses: true
      
      - name: Sync to Android
        run: pnpm exec cap sync android
      
      - name: Build APK (unsigned)
        run: cd android && ./gradlew assembleRelease
      
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks
      
      - name: Sign APK with jarsigner
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore /tmp/keystore.jks \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.ANDROID_KEY_PASSWORD }} \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            ${{ secrets.ANDROID_KEY_ALIAS }}
      
      - name: Verify APK signature
        run: |
          jarsigner -verify -verbose android/app/build/outputs/apk/release/app-release-unsigned.apk
      
      - name: Rename signed APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             android/app/build/outputs/apk/release/geosim-signed.apk
      
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geosim-apk
          path: android/app/build/outputs/apk/release/geosim-signed.apk
